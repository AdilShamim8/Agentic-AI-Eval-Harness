version: '3.8'

services:
  # 1. Status service: runs status health check and exits
  status:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["status"]
    volumes:
      - ./evals/runs:/app/evals/runs
      - ./evals/baselines:/app/evals/baselines

  # 2. Benchmark Runner service: run benchmarks with arbitrary flags
  # Usage: docker compose run --rm runner run --benchmark react_basic
  runner:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["agent-eval"]
    command: ["run", "--benchmark", "react_basic"]
    volumes:
      - ./evals/runs:/app/evals/runs
      - ./evals/baselines:/app/evals/baselines

  # 3. Web Dashboard service: provides browser UI on port 8000
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./evals/runs:/app/evals/runs:ro
      - ./evals/baselines:/app/evals/baselines:ro
    restart: unless-stopped
