benchmark:
  name: map_reduce_basic
  version: "1.0"
  pattern: map_reduce
  description: map_reduce pattern golden benchmark (56 cases, 6 categories)

agent: builtin:map_reduce

dataset:
  path: datasets/map_reduce/golden.jsonl

evaluators:
  - task_checks
  - tool_selection
  - trajectory
  - termination
  - tool_efficiency
  - loop_detection

thresholds:
  overall_pass_rate: 0.7
  task_checks: 0.75
  tool_selection: 0.75
  trajectory: 0.6
  termination: 0.8
  tool_efficiency: 0.6
  loop_detection: 0.9

execution:
  ablation: full


gates:
  pass_rate_max_regression: 0.03
