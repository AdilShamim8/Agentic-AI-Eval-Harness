name: eval-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  evaluation-gate:
    # Selected evaluations act as QUALITY GATES: CI FAILS if quality drops
    # below the approved baseline thresholds (configs/gates.yaml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Smoke evaluation (blocking)
        run: |
          set -e
          for b in react_basic plan_execute_basic supervisor_basic swarm_basic map_reduce_basic; do
            agent-eval run --benchmark $b --limit 8
          done
      - name: Full benchmark run + threshold gates (blocking)
        run: |
          set -e
          agent-eval run --benchmark react_basic --json > "$RUNNER_TEMP/react_full_run.json"
          agent-eval run --benchmark failure_recovery
        env:
          RUNNER_TEMP: ${{ runner.temp }}
      - name: Regression gate vs committed baseline (blocking)
        run: |
          set -e
          # Select the run EXPLICITLY by the id captured from the react_basic
          # command above. Never `ls -t evals/runs` — mtime-based selection can
          # pick the wrong benchmark's artifact (it used to gate the
          # failure_recovery run against the react_basic baseline).
          RUN_ID=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['run_id'])" "$RUNNER_TEMP/react_full_run.json")
          BENCH=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['benchmark'])" "$RUNNER_TEMP/react_full_run.json")
          echo "gating run: $RUN_ID (benchmark: $BENCH) vs baseline 'main'"
          test "$BENCH" = "react_basic"
          agent-eval regression "$RUN_ID" --baseline main
        env:
          RUNNER_TEMP: ${{ runner.temp }}
      - name: Adversarial security evaluation (blocking)
        run: |
          agent-eval run --benchmark adversarial
      - name: Reproducibility check (same seed must be identical)
        run: |
          agent-eval repro --benchmark react_basic --repeats 3
